[package]
name = "alexihub-desktop"
version = "1.0.0"
description = "Desktop client for AlexiHub"
authors = ["AlexiHub"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "alexihub_desktop_lib"
