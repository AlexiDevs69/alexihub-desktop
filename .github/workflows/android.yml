name: Build AlexiHub for Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK parts
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Install npm packages
        run: npm install

      - name: Generate icons
        run: |
          if [ -f src-tauri/icons/icon.png ]; then
            npx tauri icon src-tauri/icons/icon.png
          fi

      - name: Init Android project
        run: npx tauri android init --ci

      - name: Build release APK (arm64)
        run: npx tauri android build --apk --target aarch64

      - name: Sign APK
        run: |
          BT=$ANDROID_HOME/build-tools/34.0.0
          UNSIGNED=$(find src-tauri/gen/android -name "*unsigned*.apk" | head -n 1)
          echo "Found: $UNSIGNED"
          keytool -genkeypair -keystore $RUNNER_TEMP/ks.jks -alias alexihub \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass alexihub123 -keypass alexihub123 -dname "CN=AlexiHub"
          $BT/zipalign -p 4 "$UNSIGNED" $RUNNER_TEMP/aligned.apk
          mkdir -p out
          $BT/apksigner sign --ks $RUNNER_TEMP/ks.jks --ks-key-alias alexihub \
            --ks-pass pass:alexihub123 --key-pass pass:alexihub123 \
            --out out/AlexiHub.apk $RUNNER_TEMP/aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AlexiHub-Android-APK
          path: out/AlexiHub.apk
